  // This script checks to see if a redirect is present in the query string,
  // converts it back into a clean URL, and adds it to the browser's history.
  (function(l) {
    if (l.search[1] === 'p' ) {
      var decoded = l.search.slice(1).split('&').map(function(s) { 
        return s.replace(/~and~/g, '&') 
      }).filter(function(v) {
        return v.indexOf('p=') === 0;
      })[0].replace('p=', '/');

      if (decoded !== undefined) {
        // Clean the URL and replace the history state
        var nextUrl = l.pathname.slice(0, -1) + decoded + l.hash;
        history.replaceState(null, null, nextUrl);
      }
    }
  }(window.location));
</script>
